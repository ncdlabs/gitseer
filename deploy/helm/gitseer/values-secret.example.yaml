# Example Helm secret values for chart secret.create=true.
#
# Copy to values-secret.yaml (gitignored) and fill real values, then:
#   helm upgrade --install gitseer deploy/helm/gitseer -n gitseer \
#     -f deploy/helm/gitseer/values.yaml \
#     -f deploy/helm/gitseer/values-secret.yaml
#
# Prefer an existing Kubernetes Secret (secret.create=false + existingSecret)
# in production so secrets never land in values files.

secret:
  create: true
  existingSecret: ""
  # All keys below are always written into the chart Secret (empty string is OK).
  # Claim bootstrap password in the UI; generate encryption in /setup Prepare when unset.
  # If env sets GITSEER_GITEA_URL (or other forge URL), set the matching webhook secret.
  giteaToken: ""
  bootstrapUsername: "admin"
  bootstrapKeepAfterSetup: "true"
  bootstrapPassword: ""  # legacy seed only — prefer empty; claim in UI
  oauthClientId: ""
  oauthClientSecret: ""
  webhookSecret: ""
  encryptionKey: ""
  metricsToken: ""
