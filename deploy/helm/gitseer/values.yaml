replicaCount: 1  # >1 only with sticky SSE + DB leases; never multi-replica SQLite
image:
  repository: git.ncdlabs.com/ncdlabs/gitseer
  tag: latest
  pullPolicy: IfNotPresent
imagePullSecrets: []
service:
  type: ClusterIP
  port: 8090
persistence:
  enabled: true
  size: 5Gi
nodeSelector: {}
tolerations: []
resources: {}
env:
  GITSEER_SERVER_LISTEN: 0.0.0.0:8090
  GITSEER_DATABASE_PATH: /data/gitseer.db
secret:
  create: false
  existingSecret: ""
  giteaToken: ""
  bootstrapUsername: "admin"
  bootstrapKeepAfterSetup: "true"
  bootstrapPassword: ""  # deprecated — leave empty; claim in UI on first visit
  oauthClientId: ""
  oauthClientSecret: ""
  webhookSecret: ""
  encryptionKey: ""
  metricsToken: ""
ingress:
  enabled: false
  className: traefik
  annotations: {}
  hosts: []
  tls: []
certificate:
  enabled: false
  issuerKind: ClusterIssuer
  issuerName: letsencrypt-cloudflare-production
  dnsNames: []
