# Example site-specific Helm values for a single-node / home k3s (or similar) cluster.
#
# Copy to values-k3s-home.yaml (gitignored) and edit for your environment:
#   cp deploy/helm/gitseer/values-k3s-home.example.yaml deploy/helm/gitseer/values-k3s-home.yaml
#
# Secrets stay out of this file — use an existing Secret, or create from
# values-secret.example.yaml (also gitignored when copied to values-secret.yaml).

replicaCount: 1

image:
  repository: ghcr.io/ncdlabs/gitseer
  tag: "1.0.9"
  pullPolicy: IfNotPresent

imagePullSecrets: []
# - name: registry-pull-secret

service:
  type: ClusterIP
  port: 8090

persistence:
  enabled: true
  size: 5Gi

nodeSelector:
  kubernetes.io/arch: amd64

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

env:
  GITSEER_SERVER_LISTEN: "0.0.0.0:8090"
  GITSEER_SERVER_EXTERNAL_URL: "https://gitseer.example.com"
  GITSEER_DATABASE_PATH: "/data/gitseer.db"
  GITSEER_GITEA_URL: "https://git.example.com"
  GITSEER_GITEA_ALLOW_PRIVATE_NETWORK: "false"
  GITSEER_AUTH_COOKIE_SECURE: "true"
  GITSEER_UI_INSTANCE_NAME: "GitSeer"
  GITSEER_LOG_FORMAT: "json"
  GITSEER_SYNC_RECONCILE_INTERVAL: "5m"
  GITSEER_SYNC_HISTORY_DAYS: "30"
  # Peer CIDRs allowed to set X-Forwarded-For / X-Real-IP (adjust to your CNI).
  GITSEER_SERVER_TRUSTED_PROXIES: "10.42.0.0/16,10.43.0.0/16"

secret:
  create: false
  existingSecret: gitseer
  # When create=true, populate via --set-file / values-secret.yaml (do not commit):
  giteaToken: ""
  bootstrapPassword: ""
  oauthClientId: ""
  oauthClientSecret: ""
  webhookSecret: ""
  encryptionKey: ""
  # metricsToken: ""

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: gitseer.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: gitseer-tls
      hosts:
        - gitseer.example.com

certificate:
  enabled: true
  issuerKind: ClusterIssuer
  issuerName: letsencrypt-production
  dnsNames:
    - gitseer.example.com
