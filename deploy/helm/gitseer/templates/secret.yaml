{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gitseer.fullname" . }}
  labels:
    app.kubernetes.io/name: gitseer
type: Opaque
stringData:
  {{- if .Values.secret.giteaToken }}
  GITSEER_GITEA_TOKEN: {{ .Values.secret.giteaToken | quote }}
  {{- end }}
  {{- if .Values.secret.bootstrapPassword }}
  GITSEER_AUTH_BOOTSTRAP_PASSWORD: {{ .Values.secret.bootstrapPassword | quote }}
  {{- end }}
  {{- if .Values.secret.oauthClientId }}
  GITSEER_AUTH_OAUTH_CLIENT_ID: {{ .Values.secret.oauthClientId | quote }}
  {{- end }}
  {{- if .Values.secret.oauthClientSecret }}
  GITSEER_AUTH_OAUTH_CLIENT_SECRET: {{ .Values.secret.oauthClientSecret | quote }}
  {{- end }}
  {{- if .Values.secret.webhookSecret }}
  GITSEER_WEBHOOK_SECRET: {{ .Values.secret.webhookSecret | quote }}
  {{- end }}
  {{- if .Values.secret.encryptionKey }}
  GITSEER_ENCRYPTION_KEY: {{ .Values.secret.encryptionKey | quote }}
  {{- end }}
  {{- if .Values.secret.metricsToken }}
  GITSEER_METRICS_TOKEN: {{ .Values.secret.metricsToken | quote }}
  {{- end }}
{{- end }}
