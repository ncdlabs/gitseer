{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gitseer.fullname" . }}
  labels:
    app.kubernetes.io/name: gitseer
type: Opaque
stringData:
  # Always emit keys the Deployment mounts (empty string is OK — claim password in UI / wizard OAuth).
  GITSEER_GITEA_TOKEN: {{ .Values.secret.giteaToken | default "" | quote }}
  GITSEER_AUTH_BOOTSTRAP_USERNAME: {{ .Values.secret.bootstrapUsername | default "admin" | quote }}
  GITSEER_AUTH_BOOTSTRAP_KEEP_AFTER_SETUP: {{ .Values.secret.bootstrapKeepAfterSetup | default "true" | quote }}
  GITSEER_AUTH_BOOTSTRAP_PASSWORD: {{ .Values.secret.bootstrapPassword | default "" | quote }}
  GITSEER_AUTH_OAUTH_CLIENT_ID: {{ .Values.secret.oauthClientId | default "" | quote }}
  GITSEER_AUTH_OAUTH_CLIENT_SECRET: {{ .Values.secret.oauthClientSecret | default "" | quote }}
  GITSEER_WEBHOOK_SECRET: {{ .Values.secret.webhookSecret | default "" | quote }}
  GITSEER_ENCRYPTION_KEY: {{ .Values.secret.encryptionKey | default "" | quote }}
  {{- if .Values.secret.metricsToken }}
  GITSEER_METRICS_TOKEN: {{ .Values.secret.metricsToken | quote }}
  {{- end }}
{{- end }}
