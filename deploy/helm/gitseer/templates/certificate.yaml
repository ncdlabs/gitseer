{{- if and .Values.ingress.enabled .Values.certificate.enabled (gt (len .Values.ingress.tls) 0) }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "gitseer.fullname" . }}
  labels:
    app.kubernetes.io/name: gitseer
spec:
  secretName: {{ (index .Values.ingress.tls 0).secretName }}
  dnsNames:
    {{- range .Values.certificate.dnsNames }}
    - {{ . | quote }}
    {{- end }}
  issuerRef:
    kind: {{ .Values.certificate.issuerKind }}
    name: {{ .Values.certificate.issuerName }}
  duration: 2160h
  renewBefore: 360h
{{- end }}
