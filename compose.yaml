services:
  gitseer:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      GITSEER_SERVER_LISTEN: 0.0.0.0:8090
      GITSEER_DATABASE_PATH: /data/gitseer.db
      GITSEER_GITEA_URL: ${GITSEER_GITEA_URL:-}
      GITSEER_GITEA_TOKEN: ${GITSEER_GITEA_TOKEN:-}
      # Leave empty to disable bootstrap login; set explicitly for lab/dev.
      GITSEER_AUTH_BOOTSTRAP_PASSWORD: ${GITSEER_AUTH_BOOTSTRAP_PASSWORD:-}
      GITSEER_SERVER_EXTERNAL_URL: ${GITSEER_SERVER_EXTERNAL_URL:-http://127.0.0.1:8090}
      GITSEER_AUTH_OAUTH_CLIENT_ID: ${GITSEER_AUTH_OAUTH_CLIENT_ID:-}
      GITSEER_AUTH_OAUTH_CLIENT_SECRET: ${GITSEER_AUTH_OAUTH_CLIENT_SECRET:-}
      GITSEER_GITEA_ALLOW_PRIVATE_NETWORK: ${GITSEER_GITEA_ALLOW_PRIVATE_NETWORK:-false}
      GITSEER_LOG_FORMAT: json
    volumes:
      - gitseer-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  gitseer-data:
