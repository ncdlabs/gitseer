version: "2"
sql:
  - engine: "sqlite"
    schema: "internal/store/sqlc/schema/sqlite"
    queries: "internal/store/sqlc/queries"
    gen:
      go:
        package: "sqlitesqlc"
        out: "internal/store/sqlc/sqlite"
        sql_package: "database/sql"
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "integer"
            go_type: "int64"
          - db_type: "integer"
            nullable: true
            go_type:
              type: "int64"
              pointer: true
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
  - engine: "postgresql"
    schema: "internal/store/sqlc/schema/postgres"
    queries: "internal/store/sqlc/queries"
    gen:
      go:
        package: "postgressqlc"
        out: "internal/store/sqlc/postgres"
        sql_package: "database/sql"
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "pg_catalog.int4"
            go_type: "int64"
          - db_type: "pg_catalog.int8"
            go_type: "int64"
          - db_type: "integer"
            go_type: "int64"
          - db_type: "bigint"
            go_type: "int64"
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type:
              type: "int64"
              pointer: true
          - db_type: "pg_catalog.int8"
            nullable: true
            go_type:
              type: "int64"
              pointer: true
          - db_type: "integer"
            nullable: true
            go_type:
              type: "int64"
              pointer: true
          - db_type: "bigint"
            nullable: true
            go_type:
              type: "int64"
              pointer: true
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "pg_catalog.text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
