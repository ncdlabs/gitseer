name: cut-release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump when Version is empty
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Optional explicit X.Y.Z (overrides Bump)
        required: false
        type: string
      allow_empty:
        description: Allow empty CHANGELOG Unreleased section
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "Run this workflow from the main branch (got ${{ github.ref }})" >&2
            exit 1
          fi

      - name: Require RELEASE_TOKEN
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [[ -z "$RELEASE_TOKEN" ]]; then
            cat >&2 <<'EOF'
          Missing repo secret RELEASE_TOKEN.

          main is locked / PR-protected; GITHUB_TOKEN cannot push the release
          commit or create a tag that triggers the release workflow.

          Create a classic PAT (repo scope) or fine-grained token for an admin
          who can bypass branch protection, then:

            gh secret set RELEASE_TOKEN --repo ncdlabs/gitseer
          EOF
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cut release
        env:
          BUMP: ${{ inputs.version != '' && inputs.version || inputs.bump }}
          ALLOW_EMPTY: ${{ inputs.allow_empty }}
        run: |
          args=("$BUMP" --push)
          if [[ "$ALLOW_EMPTY" == "true" ]]; then
            args+=(--allow-empty)
          fi
          ./scripts/cut-release.sh "${args[@]}"
