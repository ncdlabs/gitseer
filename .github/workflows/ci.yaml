name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Placeholder UI for embed
        run: |
          mkdir -p internal/server/ui/dist
          echo '<!doctype html><title>Lens</title>' > internal/server/ui/dist/index.html
      - run: go mod tidy
      - run: go test ./...
      - run: go build -o bin/lens ./cmd/lens

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package.json
      - run: npm install
      - run: npm run build
